# Másold ezt a fájlt 'local.properties' névvel és töltsd ki a saját kulcsaiddal.
# A local.properties fájl SOHA nem kerül be a git repositoryba (lásd .gitignore).

# ─────────────────────────────────────────────────────
# 0. ANDROID SDK ÚTVONAL (KÖTELEZŐ)
#    Windows példa:  sdk.dir=C\:\\Users\\YourName\\AppData\\Local\\Android\\Sdk
#    macOS példa:    sdk.dir=/Users/YourName/Library/Android/sdk
#    Linux példa:    sdk.dir=/home/YourName/Android/Sdk
#
#    Az Android Studio automatikusan beállítja ezt a sort, ha a projektet
#    az android/ mappából nyitod meg. Ha manuálisan kell beállítani,
#    cseréld ki a YourName részt a saját Windows felhasználóneveddel.
# ─────────────────────────────────────────────────────
sdk.dir=C\:\\Users\\YourName\\AppData\\Local\\Android\\Sdk

# ─────────────────────────────────────────────────────
# 1. GOOGLE MAPS + PLACES API KULCS
#    Megszerzés: https://console.cloud.google.com/
#    Engedélyezd: Maps SDK for Android, Places API
# ─────────────────────────────────────────────────────
MAPS_API_KEY=AIzaSyD2XlBLjaxPDciQqwLzKr8P0F1B1X_hKr0

# ─────────────────────────────────────────────────────
# 2. OPENWEATHERMAP API KULCS (prémium időjárás funkcióhoz)
#    Ingyenes regisztráció: https://openweathermap.org/api
#    Az ingyenes tier elegendő (1000 hívás/nap)
# ─────────────────────────────────────────────────────
WEATHER_API_KEY=ide_ird_a_weather_kulcsodat

# ─────────────────────────────────────────────────────
# 3. FIREBASE BEÁLLÍTÁS (regisztráció + prémium szinkron)
#    a) Menj: https://console.firebase.google.com/
#    b) Hozz létre projektet: "PlaygroundFinder"
#    c) Add hozzá az Android alkalmazást:
#       - Package name: com.playgroundfinder.app
#    d) Töltsd le a google-services.json fájlt
#    e) Másold ide: android/app/google-services.json
#    f) Firebase Console > Authentication > Bejelentkezési módok > E-mail/Jelszó: Engedélyezés
#    g) Firebase Console > Firestore Database: Hozz létre adatbázist
# ─────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────
# 4. GOOGLE PLAY BILLING BEÁLLÍTÁS (előfizetés)
